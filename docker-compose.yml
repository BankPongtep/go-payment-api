version: "3.9"

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ENV=development
      - PORT=8080
      - DATABASE_URL=postgres://postgres:postgres@db:5432/payments_db?sslmode=disable
      - JWT_SECRET=dev-secret-change-in-prod
      - OMISE_PUBLIC_KEY=${OMISE_PUBLIC_KEY:-pkey_test_xxx}
      - OMISE_SECRET_KEY=${OMISE_SECRET_KEY:-skey_test_xxx}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
